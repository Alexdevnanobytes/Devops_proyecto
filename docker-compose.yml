services:
  frontend:
    build: ./front_despacho
    container_name: frontend
    ports:
      - "80:80"

    depends_on:
      - backend-ventas
      - backend-despachos

  backend-ventas:
    build: ./back-Ventas_SpringBoot
    container_name: backend-ventas
    ports:
      - "8080:8080"

    environment:
      DB_ENDPOINT: ${DB_ENDPOINT}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

  backend-despachos:
    build: ./back-Despachos_SpringBoot
    container_name: backend-despachos
    ports:
      - "8081:8081"

    environment:
      DB_ENDPOINT: ${DB_ENDPOINT}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}