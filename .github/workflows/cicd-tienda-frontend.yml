name: CI/CD Tienda Perritos - Frontend EKS

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/**"
      - "front_despacho/**"
  workflow_dispatch:

jobs:
  build-push-deploy-frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    - name: Configurar credenciales AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        # Credenciales temporales de tu laboratorio de AWS Academy / Vocareum
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # Crítico para el laboratorio
        aws-region: us-east-1

    - name: Login en Amazon ECR (runner)
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build imagen Frontend y push a ECR
      run: |
        # Compila la imagen usando la arquitectura x86 para los servidores de AWS EKS (linux/amd64)
        docker build \
          --platform linux/amd64 \
          --build-arg VITE_API_VENTAS=${{ secrets.VITE_API_VENTAS }} \
          -t tienda-frontend ./front_despacho
        
        # Etiqueta la imagen con la URL de tu repositorio y la sube a la nube
        docker tag tienda-frontend:latest 209679629646.dkr.ecr.us-east-1.amazonaws.com/tienda-frontend:eks-v1
        docker push 209679629646.dkr.ecr.us-east-1.amazonaws.com/tienda-frontend:eks-v1

    - name: Actualizar Kubeconfig para conectar con EKS
      run: |
        # Le dice al Runner de GitHub cómo conectarse de forma segura a tu clúster
        aws eks update-kubeconfig --region us-east-1 --name tienda-eks

    - name: Desplegar y Actualizar en EKS (Kubectl)
      run: |
        # Aplica los manifiestos por si hay cambios en el Service o Deployment
        # Nota: Ajusta la ruta si tus archivos yaml están dentro de otra carpeta (ej: ./devops_proyecto/k8s/)
        kubectl apply -f k8s/namespace.yaml
        kubectl apply -f k8s/frontend-deployment.yaml
        kubectl apply -f k8s/frontend-service.yaml
        
        # Fuerza a Kubernetes a descargar la nueva imagen y reiniciar los pods sin caídas de servicio
        kubectl set image deployment/tienda-frontend tienda-frontend=209679629646.dkr.ecr.us-east-1.amazonaws.com/tienda-frontend:eks-v1 -n tienda
        kubectl rollout restart deployment/tienda-frontend -n tienda