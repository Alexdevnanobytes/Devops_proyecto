name: CI/CD Tienda Perritos - Backend

on:
  push:
    branches: [ "main", "deploy" ]
    paths:
      - "back-Ventas_SpringBoot/**"
      - "back-Despachos_SpringBoot/**"

jobs:
  build-push-deploy-backend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    - name: Configurar credenciales AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login en Amazon ECR (runner)
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build imagen Backend Ventas y push a ECR
      run: |
        docker build -t tienda-backend-ventas ./back-Ventas_SpringBoot/Springboot-API-REST
        docker tag tienda-backend-ventas:latest ${{ secrets.ECR_REPO_URL_BACKEND_VENTAS }}:latest
        docker push ${{ secrets.ECR_REPO_URL_BACKEND_VENTAS }}:latest

  - name: Desplegar Backend Ventas vía SSM
      run: |
        aws ssm send-command \
          --instance-ids ${{ secrets.EC2_BACKEND_VENTAS_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --comment "Actualizar tienda-backend-ventas desde ECR" \
          --parameters '{"commands":[
            "set -e",
            "aws ecr get-login-password --region '${{ secrets.AWS_REGION }}' | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
            "docker pull ${{ secrets.ECR_REPO_URL_BACKEND_VENTAS }}:latest",
            "docker stop tienda-backend-ventas || true",
            "docker rm tienda-backend-ventas || true",
            "docker run -d --name tienda-backend-ventas -p 8080:8080 ${{ secrets.ECR_REPO_URL_BACKEND_VENTAS }}:latest"
          ]}' \
          --output text

    - name: Build imagen Backend Despachos y push a ECR
      run: |
        docker build -t tienda-backend-despachos ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
        docker tag tienda-backend-despachos:latest ${{ secrets.ECR_REPO_URL_BACKEND_DESPACHOS }}:latest
        docker push ${{ secrets.ECR_REPO_URL_BACKEND_DESPACHOS }}:latest

  - name: Desplegar Backend Despachos vía SSM
      run: |
        aws ssm send-command \
          --instance-ids ${{ secrets.EC2_BACKEND_DESPACHOS_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --comment "Actualizar tienda-backend-despachos desde ECR" \
          --parameters '{"commands":[
            "set -e",
            "aws ecr get-login-password --region '${{ secrets.AWS_REGION }}' | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
            "docker pull ${{ secrets.ECR_REPO_URL_BACKEND_DESPACHOS }}:latest",
            "docker stop tienda-backend-despachos || true",
            "docker rm tienda-backend-despachos || true",
            "docker run -d --name tienda-backend-despachos -p 8081:8081 ${{ secrets.ECR_REPO_URL_BACKEND_DESPACHOS }}:latest"
          ]}' \
          --output text